name: local-containers

services:
  postgres18:
    image: postgres:18
    container_name: postgres18
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: ${TZ}
      PGTZ: ${TZ}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - local-infra

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -n "${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        else
          exec redis-server --appendonly yes
        fi
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "${REDIS_PASSWORD:-}" ]; then
            redis-cli -a "${REDIS_PASSWORD}" ping
          else
            redis-cli ping
          fi
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - local-infra

  temporal:
    image: temporalio/temporal:1.10.0
    container_name: temporal
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
    ports:
      - "127.0.0.1:${TEMPORAL_GRPC_PORT:-7233}:7233"
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233"
    volumes:
      - temporal_data:/home/temporal
    healthcheck:
      test:
        - CMD
        - temporal
        - operator
        - namespace
        - describe
        - --address
        - 127.0.0.1:7233
        - --namespace
        - default
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - local-infra

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6-alpine@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146
    profiles: [analytics]
    container_name: clickhouse
    restart: unless-stopped
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      CLICKHOUSE_USER: local_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?请在 .env 中配置 ClickHouse 管理密码}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/local.xml:ro
    networks:
      - local-infra
    healthcheck:
      test: [CMD, wget, --quiet, --spider, 'http://127.0.0.1:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  postgres18_data:
  redis_data:
  temporal_data:
  clickhouse_data:

networks:
  local-infra:
    name: local-infra
